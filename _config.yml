###########################################################
### Beautiful Jekyll config — Timofei Ivankov's tech blog
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: Timofei Ivankov

# Your name to show in the footer
author: Timofei Ivankov

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  About: "aboutme"
  Writing: "/"
  CPython PRs: "https://github.com/python/cpython/pulls?q=is%3Apr+author%3Adeadlovelll"
  GitHub: "https://github.com/deadlovelll"

################
# --- Logo --- #
################

# No avatar in the navbar. With `avatar` unset, nav.html skips the whole
# .avatar-container block, so there is no image and no empty circle either.
# To bring it back: drop a square photo at assets/img/avatar.jpeg and uncomment.
#avatar: "/assets/img/avatar.jpeg"
#round-avatar: true

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  email: "idonthavetwelvebrothers@outlook.com"
  rss: true
  github: deadlovelll
  linkedin: timofei-ivankov
#  twitter: yourhandle        # uncomment and set if you make an X/Twitter for the blog

# RSS feed description
rss-description: Notes on CPython internals, asyncio, runtime performance, and the bugs I chase.

###########################
# --- General options --- #
###########################

# Which share buttons to show on posts. LinkedIn + Reddit matter most for dev reach.
share-links-active:
  twitter: true
  facebook: false
  linkedin: true
  vk: false
  reddit: true

# How to display the link to your website in the footer
url-pretty: "timofeiivankov.dev"   # change if you buy a different domain, or comment out

# Add the website title to the title of every page
title-on-all-pages: true

# Excerpt length on the feed page
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true

# Search button in the navbar
post_search: true

# "Edit this page" button in the footer (works because the site lives on GitHub)
edit_page_button: true

navbar-var-length: false

# SEO keywords
keywords: "CPython, asyncio, Python internals, free-threaded Python, JIT, runtime performance, Timofei Ivankov"

######################################
# --- Colours / background image --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

#################################
# --- Web Analytics Section --- #
#################################

# Optional: add a Google Analytics tag ID later to see traffic (useful as an audience metric).
#gtag: "G-XXXXXXXXXX"

####################
# --- Comments --- #
####################

# Optional: giscus gives you GitHub-Discussions-based comments. Set up later if you want them.
#giscus:
#  repository: deadlovelll/deadlovelll.github.io
#  ...

################
# --- Misc --- #
################

date_format: "%B %-d, %Y"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

timezone: "Europe/Moscow"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
